name: DevSecOps Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Update npm to latest
        run: npm install -g npm@latest

      - name: Remove old lockfiles
        run: rm -f package-lock.json frontend/package-lock.json

      - name: Install root dependencies (skip automatic build)
        run: npm install --ignore-scripts

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend (skip broken sbom step)
        run: cd frontend && npx ng build --configuration production

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SAST scan with Semgrep
        run: |
          pip install semgrep
          semgrep scan --config=p/default --error

      - name: Generate lockfiles for dependency scan
        run: |
          npm install --package-lock-only --package-lock=true
          cd frontend && npm install --package-lock-only --package-lock=true

      - name: Dependency scan with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          scanners: vuln